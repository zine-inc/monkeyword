name: mcp-build

on:
  pull_request:
    paths:
      - 'monkeyword-mcp/**'
      - '.github/workflows/mcp-build.yml'
  push:
    branches: [main]
    paths:
      - 'monkeyword-mcp/**'
      - '.github/workflows/mcp-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monkeyword-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: monkeyword-mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
